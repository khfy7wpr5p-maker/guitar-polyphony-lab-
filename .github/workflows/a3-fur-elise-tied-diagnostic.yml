name: A3 Für Elise tied diagnostic

on:
  push:
    branches:
      - 'stage/a3-fur-elise-tied-capability'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Lab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked Lab dependencies
        run: npm ci --ignore-scripts

      - name: Checkout pinned real piano corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: musetrainer/library
          ref: 9128876f6164d96997c877a2be843349a32bdabb
          path: .a3-piano-corpus
          persist-credentials: false

      - name: Reproduce Für Elise tied parser failure with details
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { parseMusicXmlPartwise } from './src/musicxml/partwiseParser.js';

          const mxlPath = '.a3-piano-corpus/scores/Fur_Elise_fingered.mxl';
          const expectedHead = '9128876f6164d96997c877a2be843349a32bdabb';
          const observedHead = execFileSync('git', ['-C', '.a3-piano-corpus', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (observedHead !== expectedHead) throw new Error(`SOURCE_PROVENANCE_MISMATCH ${observedHead}`);

          const containerXml = execFileSync('unzip', ['-p', mxlPath, 'META-INF/container.xml'], { encoding: 'utf8' });
          const rootMatch = containerXml.match(/<rootfile\b[^>]*\bfull-path=["']([^"']+)["'][^>]*>/i);
          if (!rootMatch) throw new Error('MXL_CONTAINER_ROOTFILE_MISSING');
          const rootfile = rootMatch[1];
          let xml = execFileSync('unzip', ['-p', mxlPath, rootfile], { encoding: 'utf8', maxBuffer: 20 * 1024 * 1024 });

          const verifiedDoctype = /<!DOCTYPE\s+score-partwise\s+PUBLIC\s+"-\/\/Recordare\/\/DTD MusicXML\s+[0-9]+(?:\.[0-9]+)*\s+Partwise\/\/EN"\s+"http:\/\/www\.musicxml\.org\/dtds\/partwise\.dtd"\s*>\s*/g;
          const matches = [...xml.matchAll(verifiedDoctype)];
          if (matches.length !== 1 || /<!ENTITY\b/i.test(xml)) throw new Error('UNSAFE_OR_UNEXPECTED_DECLARATION');
          xml = xml.replace(verifiedDoctype, '');

          try {
            parseMusicXmlPartwise(xml, { maxBytes: 20 * 1024 * 1024 });
            console.log(JSON.stringify({ status: 'UNEXPECTED_SUPPORTED' }));
            process.exitCode = 1;
          } catch (error) {
            const diagnostic = {
              status: 'EXPECTED_FAILURE',
              errorCode: error?.code ?? error?.name ?? 'ERROR',
              message: error instanceof Error ? error.message : String(error),
              details: error?.details ?? null,
            };
            console.log('A3_FUR_ELISE_TIED_DIAGNOSTIC');
            console.log(JSON.stringify(diagnostic, null, 2));
            if (diagnostic.errorCode !== 'UNSUPPORTED_TIED_TYPE') process.exitCode = 1;
          }
          NODE
