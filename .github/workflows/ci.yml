name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'stage/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Lab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked Lab dependencies
        run: npm ci --ignore-scripts

      - name: Syntax check
        run: npm run check

      - name: Test
        run: npm test

      - name: Checkout pinned Engine source for V1B/V1C/V2 evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: khfy7wpr5p-maker/musicxml-to-guitar-tab-engine
          ref: 1d8ced644f544f7e991f7275eda77a2ce557774e
          path: .v1b-engine
          persist-credentials: false

      - name: Install locked Engine dependencies
        run: npm ci --ignore-scripts --prefix .v1b-engine

      - name: Generate pinned real Engine V1B artifacts
        run: node scripts/generate-v1b-engine-artifacts.cjs --engine-root .v1b-engine --output-dir v1b-generated

      - name: Verify committed V1B evidence reproduces byte-for-byte
        run: diff -ru artifacts/v1b-engine v1b-generated

      - name: Upload V1B Engine evidence artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v1b-engine-artifacts
          path: v1b-generated
          if-no-files-found: error
          retention-days: 7

      - name: Checkout pinned external MusicXML capability corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: w3c-cg/musicxmlTestSuite
          ref: 77c19f7e819154c70ca1a1992e80dcda8ff82fea
          path: .v1c-musicxml-tests
          persist-credentials: false

      - name: Checkout pinned real piano corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: musetrainer/library
          ref: 9128876f6164d96997c877a2be843349a32bdabb
          path: .a3-piano-corpus
          persist-credentials: false

      - name: Generate observed V1C capability report
        run: >-
          node scripts/run-v1c-capability-corpus.mjs
          --external-root .v1c-musicxml-tests
          --engine-root .v1b-engine
          --output v1c-observed/report.json

      - name: Upload observed V1C capability report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v1c-capability-observed
          path: v1c-observed/report.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify V1C external MusicXML capability baseline
        run: >-
          node scripts/run-v1c-capability-corpus.mjs
          --external-root .v1c-musicxml-tests
          --engine-root .v1b-engine
          --output v1c-generated/report.json
          --assert-expectations

      - name: Verify committed V1C report reproduces semantically
        run: node scripts/verify-v1c-committed-report.mjs --generated v1c-generated/report.json

      - name: Generate V2 failure intelligence report
        run: >-
          node scripts/run-v2-failure-intelligence.mjs
          --engine-root .v1b-engine
          --output v2-generated/failure-intelligence-report.json
          --assert-covered

      - name: Verify committed V2 failure intelligence baseline
        run: >-
          node scripts/verify-v2-failure-intelligence-report.mjs
          --generated v2-generated/failure-intelligence-report.json

      - name: Generate V2B projection refinement report
        run: >-
          node scripts/run-v2b-projection-refinement.mjs
          --external-root .v1c-musicxml-tests
          --engine-root .v1b-engine
          --output v2b-generated/projection-refinement-report.json

      - name: Verify committed V2B projection refinement baseline
        run: >-
          node scripts/verify-v2b-projection-refinement-report.mjs
          --generated v2b-generated/projection-refinement-report.json

      - name: Generate V3A strict feasibility benchmark
        run: >-
          node scripts/run-v3a-strict-feasibility-benchmark.mjs
          --output v3a-generated/strict-feasibility-report.json
          --assert-expectations

      - name: Verify committed V3A strict feasibility baseline
        run: >-
          node scripts/verify-v3a-strict-feasibility-report.mjs
          --generated v3a-generated/strict-feasibility-report.json

      - name: Generate V3B left-hand comparison benchmark
        run: >-
          node scripts/run-v3b-left-hand-benchmark.mjs
          --engine-root .v1b-engine
          --output v3b-generated/left-hand-benchmark-report.json
          --assert-expectations

      - name: Verify committed V3B left-hand benchmark baseline
        run: >-
          node scripts/verify-v3b-left-hand-benchmark-report.mjs
          --generated v3b-generated/left-hand-benchmark-report.json

      - name: Generate A2 bounded arrangement benchmark
        run: >-
          node scripts/run-a2-arrangement-benchmark.mjs
          --output a2-generated/arrangement-generation-report.json
          --assert-expectations

      - name: Verify committed A2 bounded arrangement baseline
        run: >-
          node scripts/verify-a2-arrangement-benchmark.mjs
          --generated a2-generated/arrangement-generation-report.json

      - name: Generate A2B temporal composition benchmark
        run: >-
          node scripts/run-a2b-temporal-composition-benchmark.mjs
          --output a2b-generated/temporal-composition-report.json
          --assert-expectations

      - name: Verify committed A2B temporal composition baseline
        run: >-
          node scripts/verify-a2b-temporal-composition-benchmark.mjs
          --generated a2b-generated/temporal-composition-report.json

      - name: Generate A2C timeline arrangement benchmark
        run: >-
          node scripts/run-a2c-timeline-arrangement-benchmark.mjs
          --output a2c-generated/timeline-arrangement-report.json
          --assert-expectations

      - name: Verify committed A2C timeline arrangement baseline
        run: >-
          node scripts/verify-a2c-timeline-arrangement-benchmark.mjs
          --generated a2c-generated/timeline-arrangement-report.json

      - name: Generate A3 real piano corpus discovery
        run: >-
          node scripts/run-a3-real-piano-corpus-discovery.mjs
          --external-root .a3-piano-corpus
          --output a3-generated/real-piano-corpus-discovery.json

      - name: Upload A3 real piano corpus discovery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a3-real-piano-corpus-discovery
          path: a3-generated/real-piano-corpus-discovery.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload A2C timeline arrangement benchmark
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a2c-timeline-arrangement-report
          path: a2c-generated/timeline-arrangement-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload A2B temporal composition benchmark
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a2b-temporal-composition-report
          path: a2b-generated/temporal-composition-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload A2 bounded arrangement benchmark
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a2-arrangement-generation-report
          path: a2-generated/arrangement-generation-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload V3B left-hand comparison benchmark
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v3b-left-hand-benchmark-report
          path: v3b-generated/left-hand-benchmark-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload V3A strict feasibility benchmark
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v3a-strict-feasibility-report
          path: v3a-generated/strict-feasibility-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload V2B projection refinement report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v2b-projection-refinement-report
          path: v2b-generated/projection-refinement-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload V1C capability report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v1c-capability-report
          path: v1c-generated/report.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload V2 failure intelligence report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v2-failure-intelligence-report
          path: v2-generated/failure-intelligence-report.json
          if-no-files-found: error
          retention-days: 7
